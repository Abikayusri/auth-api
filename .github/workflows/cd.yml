name: Continuous Deployment

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: [self-hosted, local-deploy]

    steps:
      - name: Deploy app
        run: |
          cd ~/deploy/auth-api
          git pull origin master
          npm ci --no-audit --no-fund
          npm run migrate up
          pm2 restart auth-api
